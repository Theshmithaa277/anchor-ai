<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In &mdash; Anchor AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/onboarding.css') }}">
</head>
<body class="onboarding">

  <nav class="onboarding-nav">
    <a class="onboarding-wordmark" href="{{ url_for('auth.welcome') }}" style="text-decoration:none;">
      <strong>ANCHOR</strong> AI
    </a>
    <div class="onboarding-wordmark">GROUNDED ANSWERS</div>
  </nav>

  <main class="auth-stage">
    <div class="frosted-panel">
      <h1 class="panel-heading">Welcome back</h1>
      <p class="panel-subcopy">Sign in to continue to your knowledge base.</p>

      {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
          <div class="form-error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <div class="field">
          <input id="email" name="email" type="email" placeholder=" "
                 value="{{ email or '' }}" required autocomplete="email">
          <label for="email">Email</label>
        </div>

        <div class="field has-toggle">
          <input id="password" name="password" type="password" placeholder=" "
                 required autocomplete="current-password">
          <label for="password">Password</label>
          <button type="button" class="field-toggle" data-password-toggle="password">Show</button>
        </div>

        <div class="field-row-between">
          <label style="display:flex;align-items:center;gap:6px;">
            <input type="checkbox" name="remember" checked style="accent-color:#0B1E3A;">
            Remember me
          </label>
          <a href="#" title="Coming soon" tabindex="-1" style="opacity:0.6;cursor:default;">Forgot password?</a>
        </div>

        <button type="submit" class="metallic-btn">Sign In</button>
        <button type="button" class="ghost-btn" disabled title="Coming soon">
          Continue with Google
        </button>
      </form>

      <p class="panel-footer">
        Don&rsquo;t have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
      </p>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/onboarding.js') }}"></script>
</body>
</html>
