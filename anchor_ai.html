<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anchor AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* Matches the @view-transition rule in static/css/onboarding.css so
     arriving here from /auth/login or /auth/signup dissolves in instead
     of hard-cutting. Chromium-based browsers only; other browsers just
     navigate normally. Nothing else in this stylesheet is touched. */
  @view-transition {
    navigation: auto;
  }

  :root {
    --bg-deep: #05060f;
    --ink: #eef2fa;
    --ink-soft: #93a3c0;
    --teal: #4cc9f0;
    --teal-soft: rgba(76, 201, 240, 0.35);
    --gold: #f2b950;
    --gold-soft: rgba(242, 185, 80, 0.4);
    --violet: #7d5cff;
    --panel: rgba(12, 16, 34, 0.55);
    --line: rgba(255, 255, 255, 0.14);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  #bg {
    position: fixed;
    inset: 0;
    background: var(--bg-deep);
  }

  #waveCanvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .eyebrow {
    position: fixed;
    top: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    z-index: 2;
  }

  #eyebrow-right {
    right: 30px;
    font-weight: 700;
    font-size: 12px;
    color: #e6edf9;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 8vh;
    z-index: 2;
  }

  #wordmarkWrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 82px;
  }

  #ring {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 2px solid var(--teal);
    box-shadow: 0 0 22px 2px var(--teal-soft);
    opacity: 0.55;
  }

  #wordmark {
    position: relative;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: 0.04em;
    color: var(--ink);
    user-select: none;
  }

  #hintCycle {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #8fa3c4;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100% - 10px);
    z-index: 1;
  }

  #hintCycle span {
    display: block;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  #hintCycle span.leaving {
    opacity: 0;
    transform: translateY(-8px);
  }

  #hintCycle span.entering {
    opacity: 0;
    transform: translateY(8px);
  }

  #hintCycle.hidden {
    opacity: 0;
  }

  #motionArea {
    width: 320px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    position: relative;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 16px;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  #motionArea.running {
    background: rgba(76, 201, 240, 0.10);
    border-color: rgba(76, 201, 240, 0.28);
    backdrop-filter: blur(4px);
  }

  .phase {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .phase.show {
    display: flex;
  }

  .phase.visible {
    opacity: 1;
  }

  .phase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #c3d3ea;
  }

  #chunkRow {
    position: relative;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 280px;
    padding: 2px 4px;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    background: rgba(76, 201, 240, 0.08);
    border: 1px solid rgba(76, 201, 240, 0.22);
    border-radius: 5px;
    padding: 2px 7px;
    opacity: 0;
    transform: translateY(10px) rotate(-3deg);
    transition:
      opacity 0.4s ease,
      transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1),
      background 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
  }

  .chip.assembled {
    opacity: 1;
    transform: translateY(0) rotate(0deg);
  }

  .chip.lit {
    background: rgba(242, 185, 80, 0.28);
    border-color: var(--gold);
    box-shadow: 0 0 10px 1px var(--gold-soft);
    color: #fff6e6;
  }

  #scanBar {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    background: linear-gradient(
      180deg,
      transparent,
      var(--gold),
      transparent
    );
    box-shadow: 0 0 8px 1px var(--gold-soft);
    opacity: 0;
    pointer-events: none;
  }

  #scanBar.sweep {
    opacity: 1;
    animation: scanSweep 0.9s cubic-bezier(0.45, 0, 0.55, 1) forwards;
  }

  @keyframes scanSweep {
    0% {
      left: 0%;
      opacity: 0;
    }

    8% {
      opacity: 1;
    }

    92% {
      opacity: 1;
    }

    100% {
      left: 100%;
      opacity: 0;
    }
  }

  #searchGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 7px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    animation: dotPulse 1.3s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%,
    100% {
      background: rgba(255, 255, 255, 0.14);
      transform: scale(1);
    }

    40% {
      background: var(--gold);
      transform: scale(1.35);
      box-shadow: 0 0 6px 1px var(--gold-soft);
    }
  }

  #sendPath {
    position: relative;
    width: 220px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .node {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #c3d3ea;
    background: rgba(242, 185, 80, 0.14);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 9px;
    z-index: 2;
  }

  #sendPath .track {
    position: absolute;
    left: 46px;
    right: 46px;
    top: 50%;
    height: 1px;
    background: var(--line);
  }

  .packet {
    position: absolute;
    top: 50%;
    left: 46px;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: var(--gold);
    transform: translate(0, -50%);
    animation: travel 1.4s ease-in-out infinite;
  }

  .packet:nth-child(3) {
    animation-delay: 0s;
  }

  .packet:nth-child(4) {
    animation-delay: 0.35s;
  }

  .packet:nth-child(5) {
    animation-delay: 0.7s;
  }

  @keyframes travel {
    0% {
      left: 46px;
      opacity: 0;
    }

    10% {
      opacity: 1;
    }

    90% {
      opacity: 1;
    }

    100% {
      left: calc(100% - 53px);
      opacity: 0;
    }
  }

  #rerankList {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 220px;
  }

  .rbar {
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.14);
    position: relative;
    overflow: hidden;
    transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .rbar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    border-radius: 4px;
    transform: scaleX(var(--w, 0.4));
    transform-origin: left;
    opacity: 0.7;
  }

  #shieldSweep {
    animation: sweep 1.1s ease-in-out 1;
  }

  @keyframes sweep {
    0% {
      transform: translateY(0);
      opacity: 1;
    }

    85% {
      transform: translateY(34px);
      opacity: 1;
    }

    100% {
      transform: translateY(34px);
      opacity: 0;
    }
  }

  #shieldCheck {
    animation: drawCheck 0.5s ease-out 1s forwards;
  }

  @keyframes drawCheck {
    to {
      stroke-dashoffset: 0;
    }
  }

  #ringProgress {
    transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  #promptRow {
    width: 340px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px;
    backdrop-filter: blur(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  #promptRow.hidden {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  #inputWrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    padding-left: 6px;
    height: 20px;
  }

  #promptInput {
    position: relative;
    z-index: 2;
    width: 100%;
    background: none;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    caret-color: var(--teal);
  }

  #caret {
    display: none;
  }

  #caret.hide {
    display: none;
  }

  #sendBtn {
    background: var(--teal);
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  #sendBtn:hover {
    transform: scale(1.06);
  }

  #sendBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  #sendBtn svg {
    width: 14px;
    height: 14px;
  }

  #attachWrap {
    position: relative;
    flex-shrink: 0;
  }

  #attachBtn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  #attachBtn:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  #attachBtn.open {
    transform: rotate(45deg);
  }

  #attachMenu {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 190px;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    backdrop-filter: blur(8px);
  }

  #attachMenu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .attach-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .attach-option:hover {
    background: rgba(76, 201, 240, 0.14);
  }

  .attach-option svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--teal);
  }

  #answer {
    display: none;
    width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
    backdrop-filter: blur(6px);
    max-height: 55vh;
    overflow-y: auto;
  }

  #answer.active {
    display: block;
  }

  #answer .cite {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #fff;
    background: var(--teal);
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 4px;
    transform: translateY(-1px);
  }

  #answer .meta {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
</style>
</head>

<body>

<div id="bg"></div>
<canvas id="waveCanvas"></canvas>

<div class="eyebrow" id="eyebrow-right">GROUNDED ANSWERS</div>

<div id="stage">

  <div id="wordmarkWrap">
    <div id="ring"></div>
    <div id="wordmark">ANCHOR AI</div>
  </div>

  <div id="motionArea">

    <div class="phase" id="phaseChunk">
      <div id="chunkRow">
        <div id="scanBar"></div>
      </div>
      <div class="phase-label">chunking input</div>
    </div>

    <div class="phase" id="phaseSearch">
      <div id="searchGrid"></div>
      <div class="phase-label">searching knowledge base</div>
    </div>

    <div class="phase" id="phaseRerank">
      <div id="rerankList"></div>
      <div class="phase-label">reranking results</div>
    </div>

    <div class="phase" id="phaseSend">
      <div id="sendPath">
        <div class="node">query</div>
        <div class="track"></div>
        <div class="packet"></div>
        <div class="packet"></div>
        <div class="packet"></div>
        <div class="node">llama</div>
      </div>
      <div class="phase-label">sending to model</div>
    </div>

    <div class="phase" id="phaseGuardrails">
      <svg id="shieldIcon" viewBox="0 0 40 46" width="40" height="46">

        <path
          d="M20 2 L36 9 V22 C36 33 29 40 20 44 C11 40 4 33 4 22 V9 Z"
          fill="none"
          stroke="#eef2fa"
          stroke-width="2.2"
          stroke-linejoin="round"
        />

        <path
          id="shieldCheck"
          d="M12 22 L18 28 L29 15"
          fill="none"
          stroke="#f2b950"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="30"
          stroke-dashoffset="30"
        />

        <rect
          id="shieldSweep"
          x="2"
          y="0"
          width="36"
          height="10"
          fill="rgba(31,182,201,0.35)"
        />

      </svg>

      <div class="phase-label">guardrail check</div>
    </div>

    <div class="phase" id="phaseFaithful">

      <svg id="ringMeter" viewBox="0 0 80 80" width="66" height="66">

        <circle
          cx="40"
          cy="40"
          r="34"
          fill="none"
          stroke="rgba(255,255,255,0.16)"
          stroke-width="5"
        />

        <circle
          id="ringProgress"
          cx="40"
          cy="40"
          r="34"
          fill="none"
          stroke="#f2b950"
          stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="213.6"
          stroke-dashoffset="213.6"
          transform="rotate(-90 40 40)"
        />

        <text
          id="ringNum"
          x="40"
          y="45"
          text-anchor="middle"
          font-family="JetBrains Mono, monospace"
          font-size="15"
          fill="#eef2fa"
        >0%</text>

      </svg>

      <div class="phase-label">faithfulness check</div>
    </div>

  </div>


  <div id="promptRow">

    <div id="attachWrap">

      <button
        type="button"
        id="attachBtn"
        aria-label="Attach"
      >+</button>

      <div id="attachMenu">

        <div class="attach-option" data-kind="image">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>

          Upload image
        </div>


        <div class="attach-option" data-kind="youtube">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="5" width="20" height="14" rx="3"/>
            <path
              d="M10 9l5 3-5 3z"
              fill="currentColor"
              stroke="none"
            />
          </svg>

          YouTube link
        </div>


        <div class="attach-option" data-kind="pdf">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>

          Upload PDF
        </div>

      </div>
    </div>


    <div id="inputWrap">

      <input
        id="promptInput"
        type="text"
        autocomplete="off"
      />

      <div id="caret"></div>

      <div id="hintCycle">
        <span id="hintText">
          Ask anything about your documents...
        </span>
      </div>

    </div>


    <button
      type="button"
      id="sendBtn"
      aria-label="Send"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="#05060f"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>

    </button>

  </div>


  <div id="answer">

    <div id="answerText"></div>

    <div class="meta">&nbsp;</div>

  </div>

</div>


<script>
(function () {

  /*
   * ==========================================================
   * API CONFIGURATION
   * ==========================================================
   *
   * When opened through Flask:
   *   http://127.0.0.1:5000
   *
   * API_BASE becomes the Flask server automatically.
   */

  const API_BASE =
    window.location.origin === 'null' ||
    window.location.protocol === 'file:'
      ? 'http://127.0.0.1:5000'
      : window.location.origin;


  const REQUEST_TIMEOUT = 60000;


  /*
   * ==========================================================
   * DOM ELEMENTS
   * ==========================================================
   */

  const attachBtn =
    document.getElementById('attachBtn');

  const attachMenu =
    document.getElementById('attachMenu');

  const fileInput =
    document.createElement('input');

  const promptRow =
    document.getElementById('promptRow');

  const promptInput =
    document.getElementById('promptInput');

  const caret =
    document.getElementById('caret');

  const sendBtn =
    document.getElementById('sendBtn');

  const motionArea =
    document.getElementById('motionArea');

  const answerBox =
    document.getElementById('answer');

  const answerText =
    document.getElementById('answerText');


  const phaseChunk =
    document.getElementById('phaseChunk');

  const phaseSearch =
    document.getElementById('phaseSearch');

  const phaseRerank =
    document.getElementById('phaseRerank');

  const phaseSend =
    document.getElementById('phaseSend');

  const phaseGuardrails =
    document.getElementById('phaseGuardrails');

  const phaseFaithful =
    document.getElementById('phaseFaithful');


  const chunkRow =
    document.getElementById('chunkRow');

  const searchGrid =
    document.getElementById('searchGrid');

  const rerankList =
    document.getElementById('rerankList');

  const ringProgress =
    document.getElementById('ringProgress');

  const ringNum =
    document.getElementById('ringNum');


  const allPhases = [
    phaseChunk,
    phaseSearch,
    phaseRerank,
    phaseSend,
    phaseGuardrails,
    phaseFaithful
  ];


  /*
   * ==========================================================
   * HIDDEN FILE INPUT
   * ==========================================================
   */

  fileInput.type = 'file';
  fileInput.style.display = 'none';

  document.body.appendChild(fileInput);


  /*
   * ==========================================================
   * REQUEST HELPER
   * ==========================================================
   *
   * This prevents the UI from silently hanging forever.
   */

  async function fetchWithTimeout(
    url,
    options = {},
    timeout = REQUEST_TIMEOUT
  ) {

    const controller =
      new AbortController();

    const timeoutId =
      setTimeout(
        () => controller.abort(),
        timeout
      );

    try {

      const response =
        await fetch(
          url,
          {
            ...options,
            signal: controller.signal
          }
        );

      return response;

    } catch (error) {

      if (error.name === 'AbortError') {

        throw new Error(
          'Request timed out. Check whether Flask and your backend are running.'
        );
      }

      throw error;

    } finally {

      clearTimeout(timeoutId);

    }
  }


  /*
   * ==========================================================
   * SAFE JSON RESPONSE
   * ==========================================================
   */

  async function parseResponse(response) {

    const text =
      await response.text();

    let data;

    try {

      data =
        text
          ? JSON.parse(text)
          : {};

    } catch {

      throw new Error(
        `Server returned invalid JSON (HTTP ${response.status}).`
      );
    }

    if (!response.ok) {

      throw new Error(
        data.message ||
        `Server returned HTTP ${response.status}.`
      );
    }

    return data;
  }


  /*
   * ==========================================================
   * ATTACH MENU
   * ==========================================================
   */

  attachBtn.addEventListener(
    'click',
    (e) => {

      e.stopPropagation();

      attachBtn.classList.toggle(
        'open'
      );

      attachMenu.classList.toggle(
        'open'
      );

    }
  );


  document.addEventListener(
    'click',
    () => {

      attachBtn.classList.remove(
        'open'
      );

      attachMenu.classList.remove(
        'open'
      );

    }
  );


  /*
   * ==========================================================
   * HINTS
   * ==========================================================
   */

  const hintCycle =
    document.getElementById('hintCycle');

  const hintText =
    document.getElementById('hintText');

  const hints = [
    'Ask anything about your documents...',
    'Paste a YouTube link...',
    'Upload a PDF...',
    'Upload an image to analyze...'
  ];

  let hintIdx = 0;
  let hintTimer = null;


  function stopHintCycle() {

    if (hintTimer) {

      clearInterval(hintTimer);

      hintTimer = null;

    }

  }


  function cycleHint() {

    hintText.classList.add(
      'leaving'
    );

    setTimeout(
      () => {

        hintIdx =
          (hintIdx + 1) %
          hints.length;

        hintText.textContent =
          hints[hintIdx];

        hintText.classList.remove(
          'leaving'
        );

        hintText.classList.add(
          'entering'
        );

        requestAnimationFrame(
          () => {

            hintText.classList.remove(
              'entering'
            );

          }
        );

      },
      350
    );

  }


  function startHintCycle() {

    stopHintCycle();

    hintTimer =
      setInterval(
        cycleHint,
        2600
      );

  }


  function refreshHintVisibility() {

    const shouldShow =
      promptInput.value.length === 0 &&
      document.activeElement !== promptInput;

    hintCycle.classList.toggle(
      'hidden',
      !shouldShow
    );

    if (shouldShow) {

      startHintCycle();

    } else {

      stopHintCycle();

    }

  }


  promptInput.addEventListener(
    'input',
    refreshHintVisibility
  );

  promptInput.addEventListener(
    'focus',
    refreshHintVisibility
  );

  promptInput.addEventListener(
    'blur',
    refreshHintVisibility
  );


  /*
   * ==========================================================
   * STATUS
   * ==========================================================
   */

  function showUploadStatus(msg) {

    hintText.textContent =
      msg;

    hintCycle.classList.remove(
      'hidden'
    );

    stopHintCycle();

  }


  /*
   * ==========================================================
   * FILE UPLOAD
   * ==========================================================
   */

  fileInput.addEventListener(
    'change',
    async () => {

      if (!fileInput.files.length) {
        return;
      }

      const selectedFile =
        fileInput.files[0];

      showUploadStatus(
        'Processing your upload...'
      );

      const formData =
        new FormData();

      formData.append(
        'file',
        selectedFile
      );

      try {

        const res =
          await fetchWithTimeout(
            API_BASE + '/ingest',
            {
              method: 'POST',
              body: formData
            }
          );

        const data =
          await parseResponse(
            res
          );

        if (data.status !== 'ok') {

          throw new Error(
            data.message ||
            'Upload failed.'
          );

        }

        showUploadStatus(
          `Added ${data.chunks_added || 0} chunks. Ask a question about it.`
        );

        promptInput.dataset.youtube =
          'false';

        promptInput.placeholder =
          '';

      } catch (e) {

        showUploadStatus(
          'Upload failed: ' + e.message
        );

      } finally {

        fileInput.value =
          '';

      }

    }
  );


  attachMenu
    .querySelectorAll('.attach-option')
    .forEach(
      opt => {

        opt.addEventListener(
          'click',
          (e) => {

            e.stopPropagation();

            const kind =
              opt.dataset.kind;

            attachBtn.classList.remove(
              'open'
            );

            attachMenu.classList.remove(
              'open'
            );


            if (kind === 'image') {

              fileInput.accept =
                '.jpg,.jpeg,.png';

              fileInput.click();

            }


            else if (kind === 'pdf') {

              fileInput.accept =
                '.pdf';

              fileInput.click();

            }


            else if (kind === 'youtube') {

              promptInput.placeholder =
                'Paste a YouTube link and hit send...';

              promptInput.dataset.youtube =
                'true';

              promptInput.focus();

            }

          }
        );

      }
    );


  /*
   * ==========================================================
   * ANIMATION DATA
   * ==========================================================
   */

  for (let i = 0; i < 32; i++) {

    const d =
      document.createElement(
        'div'
      );

    d.className =
      'dot';

    d.style.animationDelay =
      (
        Math.floor(i / 8) * 0.09 +
        (i % 8) * 0.03
      ) + 's';

    searchGrid.appendChild(
      d
    );

  }


  const initialWidths = [
    0.5,
    0.85,
    0.35,
    0.65,
    0.45
  ];


  initialWidths.forEach(
    w => {

      const bar =
        document.createElement(
          'div'
        );

      bar.className =
        'rbar';

      bar.style.setProperty(
        '--w',
        w
      );

      rerankList.appendChild(
        bar
      );

    }
  );


  /*
   * ==========================================================
   * WAVE BACKGROUND
   * ==========================================================
   */

  const waveCanvas =
    document.getElementById(
      'waveCanvas'
    );

  const wctx =
    waveCanvas.getContext('2d');

  let vw =
    window.innerWidth;

  let vh =
    window.innerHeight;

  const BUF_W = 48;
  const BUF_H = 70;

  const buffer =
    document.createElement(
      'canvas'
    );

  buffer.width =
    BUF_W;

  buffer.height =
    BUF_H;

  const bctx =
    buffer.getContext(
      '2d'
    );

  const imgData =
    bctx.createImageData(
      BUF_W,
      BUF_H
    );


  function resizeWaveCanvas() {

    vw =
      window.innerWidth;

    vh =
      window.innerHeight;

    waveCanvas.width =
      vw;

    waveCanvas.height =
      vh;

  }


  window.addEventListener(
    'resize',
    resizeWaveCanvas
  );

  resizeWaveCanvas();


  const stops = [
    [4, 5, 15],
    [12, 18, 60],
    [30, 60, 160],
    [76, 170, 230],
    [190, 230, 255]
  ];


  const violetRGB = [
    125,
    92,
    255
  ];


  function rampColor(t) {

    t =
      Math.max(
        0,
        Math.min(1, t)
      );

    const seg =
      t * (stops.length - 1);

    const i =
      Math.min(
        stops.length - 2,
        Math.floor(seg)
      );

    const f =
      seg - i;

    const a =
      stops[i];

    const b =
      stops[i + 1];

    return [
      a[0] +
        (b[0] - a[0]) * f,

      a[1] +
        (b[1] - a[1]) * f,

      a[2] +
        (b[2] - a[2]) * f
    ];

  }


  function drawField(time) {

    const t =
      time * 0.00028;

    const data =
      imgData.data;

    let idx = 0;


    for (
      let y = 0;
      y < BUF_H;
      y++
    ) {

      for (
        let x = 0;
        x < BUF_W;
        x++
      ) {

        const n1 =
          Math.sin(
            x * 0.09 +
            y * 0.05 +
            t * 3.0
          );

        const n2 =
          Math.sin(
            x * 0.03 -
            y * 0.11 -
            t * 2.0
          );

        const n3 =
          Math.sin(
            (x + y) * 0.06 +
            t * 1.2
          );

        const fold =
          n1 * 0.5 +
          n2 * 0.32 +
          n3 * 0.18;

        const b =
          (fold + 1) / 2;


        let [r, g, bl] =
          rampColor(b);


        const irid =
          Math.sin(
            x * 0.05 -
            y * 0.04 +
            t * 1.6
          ) * 0.5 + 0.5;


        if (
          irid > 0.62 &&
          b > 0.45
        ) {

          const mixAmt =
            (irid - 0.62) *
            1.6 *
            b;

          r +=
            (violetRGB[0] - r) *
            mixAmt;

          g +=
            (violetRGB[1] - g) *
            mixAmt;

          bl +=
            (violetRGB[2] - bl) *
            mixAmt;

        }


        data[idx++] =
          r;

        data[idx++] =
          g;

        data[idx++] =
          bl;

        data[idx++] =
          255;

      }

    }


    bctx.putImageData(
      imgData,
      0,
      0
    );


    wctx.imageSmoothingEnabled =
      false;

    wctx.clearRect(
      0,
      0,
      vw,
      vh
    );


    wctx.drawImage(
      buffer,
      0,
      0,
      BUF_W,
      BUF_H,
      0,
      0,
      vw,
      vh
    );


    requestAnimationFrame(
      drawField
    );

  }


  requestAnimationFrame(
    drawField
  );


  /*
   * ==========================================================
   * CURSOR
   * ==========================================================
   */

  function refreshCaret() {

    caret.classList.add(
      'hide'
    );

  }


  promptInput.addEventListener(
    'input',
    refreshCaret
  );

  refreshCaret();


  /*
   * ==========================================================
   * PROCESS ANIMATION
   * ==========================================================
   */

  let running = false;


  function showPhase(el) {

    allPhases.forEach(
      p =>
        p.classList.remove(
          'show',
          'visible'
        )
    );

    el.classList.add(
      'show'
    );

    requestAnimationFrame(
      () => {

        el.classList.add(
          'visible'
        );

      }
    );

  }


  function hidePhase(
    el,
    cb
  ) {

    el.classList.remove(
      'visible'
    );

    setTimeout(
      () => {

        el.classList.remove(
          'show'
        );

        if (cb) {
          cb();
        }

      },
      350
    );

  }


  function runChunkPhase(
    query,
    cb
  ) {

    const scanBar =
      document.getElementById(
        'scanBar'
      );


    Array.from(
      chunkRow.querySelectorAll(
        '.chip'
      )
    ).forEach(
      c => c.remove()
    );


    scanBar.classList.remove(
      'sweep'
    );

    void scanBar.offsetWidth;


    const words =
      query
        .split(/\s+/)
        .filter(Boolean);


    const chips =
      words.map(
        (w, idx) => {

          const chip =
            document.createElement(
              'span'
            );

          chip.className =
            'chip';

          chip.textContent =
            w;

          chip.style.transitionDelay =
            (idx * 50) + 'ms';

          chunkRow.appendChild(
            chip
          );

          return chip;

        }
      );


    showPhase(
      phaseChunk
    );


    requestAnimationFrame(
      () => {

        setTimeout(
          () => {

            chips.forEach(
              c =>
                c.classList.add(
                  'assembled'
                )
            );

          },
          80
        );

      }
    );


    const scanDelay =
      560;


    setTimeout(
      () =>
        scanBar.classList.add(
          'sweep'
        ),
      scanDelay
    );


    const denom =
      Math.max(
        1,
        chips.length - 1
      );


    chips.forEach(
      (chip, idx) => {

        const t =
          scanDelay +
          (idx / denom) * 780;


        setTimeout(
          () => {

            chip.classList.add(
              'lit'
            );


            setTimeout(
              () => {

                chip.classList.remove(
                  'lit'
                );

              },
              260
            );

          },
          t
        );

      }
    );


    setTimeout(
      () =>
        hidePhase(
          phaseChunk,
          cb
        ),
      1300
    );

  }


  function runSearchPhase(cb) {

    showPhase(
      phaseSearch
    );

    setTimeout(
      () =>
        hidePhase(
          phaseSearch,
          cb
        ),
      1300
    );

  }


  function runRerankPhase(cb) {

    showPhase(
      phaseRerank
    );


    setTimeout(
      () => {

        const bars =
          Array.from(
            rerankList.children
          );

        const newWidths = [
          0.92,
          0.7,
          0.55,
          0.4,
          0.28
        ];

        const order = [
          1,
          3,
          0,
          4,
          2
        ];


        order.forEach(
          (srcIdx, slot) => {

            const bar =
              bars[srcIdx];

            if (!bar) {
              return;
            }

            bar.style.setProperty(
              '--w',
              newWidths[slot]
            );

            bar.style.transform =
              'translateY(' +
              ((slot - srcIdx) * 14) +
              'px)';

          }
        );

      },
      200
    );


    setTimeout(
      () =>
        hidePhase(
          phaseRerank,
          cb
        ),
      1300
    );

  }


  function runSendPhase(cb) {

    showPhase(
      phaseSend
    );

    setTimeout(
      () =>
        hidePhase(
          phaseSend,
          cb
        ),
      1400
    );

  }


  function runGuardrailsPhase(cb) {

    const shieldSweep =
      document.getElementById(
        'shieldSweep'
      );

    const shieldCheck =
      document.getElementById(
        'shieldCheck'
      );


    shieldSweep.style.animation =
      'none';

    shieldCheck.style.animation =
      'none';


    void shieldSweep.offsetWidth;


    shieldSweep.style.animation =
      '';

    shieldCheck.style.animation =
      '';


    showPhase(
      phaseGuardrails
    );


    setTimeout(
      () =>
        hidePhase(
          phaseGuardrails,
          cb
        ),
      1500
    );

  }


  function runFaithfulPhase(cb) {

    ringProgress.style.strokeDashoffset =
      '213.6';

    ringNum.textContent =
      '0%';


    showPhase(
      phaseFaithful
    );


    requestAnimationFrame(
      () => {

        setTimeout(
          () => {

            ringProgress.style.strokeDashoffset =
              String(
                213.6 * (1 - 0.97)
              );


            let n = 0;


            const iv =
              setInterval(
                () => {

                  n += 6;


                  if (n >= 97) {

                    n = 97;

                    clearInterval(
                      iv
                    );

                  }


                  ringNum.textContent =
                    n + '%';

                },
                60
              );


          },
          150
        );

      }
    );


    setTimeout(
      () =>
        hidePhase(
          phaseFaithful,
          cb
        ),
      1400
    );

  }


  /*
   * ==========================================================
   * MARKDOWN
   * ==========================================================
   */

  function escapeHtml(text) {

    return String(text)
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      );

  }


  function renderMarkdown(text) {

    let html =
      escapeHtml(
        text
      );


    html =
      html.replace(
        /```([\s\S]*?)```/g,
        '<pre style="white-space:pre-wrap;margin:10px 0;">$1</pre>'
      );


    html =
      html.replace(
        /^### (.*)$/gm,
        '<h4 style="margin:12px 0 6px;">$1</h4>'
      );


    html =
      html.replace(
        /^## (.*)$/gm,
        '<h3 style="margin:12px 0 6px;">$1</h3>'
      );


    html =
      html.replace(
        /^# (.*)$/gm,
        '<h2 style="margin:12px 0 6px;">$1</h2>'
      );


    html =
      html.replace(
        /\*\*(.*?)\*\*/g,
        '<strong>$1</strong>'
      );


    html =
      html.replace(
        /^[-*] (.*)$/gm,
        '<li>$1</li>'
      );


    html =
      html.replace(
        /(<li>.*<\/li>)/gs,
        '<ul style="margin:6px 0 10px;padding-left:20px;">$1</ul>'
      );


    html =
      html.replace(
        /^\d+\. (.*)$/gm,
        '<li>$1</li>'
      );


    html =
      html.replace(
        /\n\n/g,
        '<br><br>'
      );


    html =
      html.replace(
        /\n/g,
        '<br>'
      );


    return html;

  }


  /*
   * ==========================================================
   * ANSWER DISPLAY
   * ==========================================================
   */

  function showRealAnswer(data) {

    answerText.innerHTML =
      renderMarkdown(
        data.answer ||
        'No answer returned.'
      );


    const cite =
      document.createElement(
        'span'
      );


    cite.className =
      'cite';

    cite.textContent =
      '[' +
      (data.num_sources || 0) +
      ']';


    answerText.appendChild(
      cite
    );


    document.querySelector(
      '#answer .meta'
    ).textContent =
      (data.num_sources || 0) +
      ' sources · faithfulness ' +
      (data.faithfulness || 0) +
      ' · ' +
      (data.total_ms || 0) +
      'ms';


    addAskAgainButton();


    answerBox.classList.add(
      'active'
    );


    motionArea.classList.remove(
      'running'
    );


    promptRow.classList.remove(
      'hidden'
    );


    sendBtn.disabled =
      false;


    running =
      false;

  }


  function showErrorAnswer(
    message
  ) {

    answerText.textContent =
      'Something went wrong: ' +
      message;


    document.querySelector(
      '#answer .meta'
    ).textContent =
      '';


    addAskAgainButton();


    answerBox.classList.add(
      'active'
    );


    motionArea.classList.remove(
      'running'
    );


    promptRow.classList.remove(
      'hidden'
    );


    sendBtn.disabled =
      false;


    running =
      false;

  }


  function addAskAgainButton() {

    const old =
      document.getElementById(
        'askAgainBtn'
      );


    if (old) {
      old.remove();
    }


    const btn =
      document.createElement(
        'button'
      );


    btn.id =
      'askAgainBtn';

    btn.textContent =
      'Ask another question';


    btn.style.cssText =
      'margin-top:14px;' +
      'background:rgba(76,201,240,0.14);' +
      'border:1px solid rgba(76,201,240,0.4);' +
      'color:#eef2fa;' +
      'padding:8px 14px;' +
      'border-radius:999px;' +
      'font-family:JetBrains Mono,monospace;' +
      'font-size:11px;' +
      'cursor:pointer;';


    btn.addEventListener(
      'click',
      () => {

        answerBox.classList.remove(
          'active'
        );

        promptInput.value =
          '';

        promptInput.dataset.youtube =
          'false';

        promptInput.placeholder =
          '';

        promptRow.classList.remove(
          'hidden'
        );

        promptInput.focus();

        refreshHintVisibility();

      }
    );


    answerBox.appendChild(
      btn
    );

  }


  /*
   * ==========================================================
   * SUBMIT
   * ==========================================================
   */

  async function submitPrompt() {

    const q =
      promptInput.value.trim();


    if (
      !q ||
      running
    ) {

      return;

    }


    running =
      true;


    sendBtn.disabled =
      true;


    answerBox.classList.remove(
      'active'
    );


    const isYouTube =
      promptInput.dataset.youtube ===
      'true';


    /*
     * --------------------------------------------------------
     * YOUTUBE
     * --------------------------------------------------------
     */

    if (isYouTube) {

      promptRow.classList.add(
        'hidden'
      );

      motionArea.classList.add(
        'running'
      );


      showUploadStatus(
        'Processing YouTube video...'
      );


      try {

        const res =
          await fetchWithTimeout(
            API_BASE + '/ingest',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                youtube_url: q
              })
            }
          );


        const data =
          await parseResponse(
            res
          );


        if (
          data.status !==
          'ok'
        ) {

          throw new Error(
            data.message ||
            'YouTube processing failed.'
          );

        }


        promptInput.value =
          '';

        promptInput.dataset.youtube =
          'false';

        promptInput.placeholder =
          '';


        motionArea.classList.remove(
          'running'
        );

        promptRow.classList.remove(
          'hidden'
        );


        showUploadStatus(
          'Video ready! Ask your question.'
        );


        promptInput.focus();

        refreshHintVisibility();


      } catch (e) {

        showErrorAnswer(
          e.message
        );


      } finally {

        running =
          false;

        sendBtn.disabled =
          false;

      }


      return;

    }


    /*
     * --------------------------------------------------------
     * NORMAL QUESTION
     * --------------------------------------------------------
     */

    promptRow.classList.add(
      'hidden'
    );

    motionArea.classList.add(
      'running'
    );


    /*
     * Start backend request immediately.
     * The animation runs while Flask processes the query.
     */

    const fetchPromise =
      fetchWithTimeout(
        API_BASE + '/ask',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            query: q
          })
        }
      )
      .then(
        parseResponse
      );


    /*
     * Run visual pipeline.
     */

    runChunkPhase(
      q,
      () => {

        runSearchPhase(
          () => {

            runRerankPhase(
              () => {

                runSendPhase(
                  () => {

                    runGuardrailsPhase(
                      () => {

                        runFaithfulPhase(
                          async () => {

                            try {

                              const data =
                                await fetchPromise;

                              showRealAnswer(
                                data
                              );

                            } catch (
                              err
                            ) {

                              showErrorAnswer(
                                err.message
                              );

                            }

                          }
                        );

                      }
                    );

                  }
                );

              }
            );

          }
        );

      }
    );

  }


  /*
   * ==========================================================
   * SEND BUTTON
   * ==========================================================
   */

  sendBtn.addEventListener(
    'click',
    submitPrompt
  );


  /*
   * ==========================================================
   * ENTER KEY
   * ==========================================================
   */

  promptInput.addEventListener(
    'keydown',
    (e) => {

      if (
        e.key ===
        'Enter'
      ) {

        e.preventDefault();

        submitPrompt();

      }

    }
  );


  /*
   * ==========================================================
   * INITIAL STATE
   * ==========================================================
   */

  promptInput.dataset.youtube =
    'false';

  promptInput.placeholder =
    '';

  sendBtn.disabled =
    false;

  refreshHintVisibility();


})();
</script>
